interface:
  display_name: "AI Promo Video Director"
  short_description: "Direct polished promo videos in any social format"
  brand_color: "#7C5CFF"
  default_prompt: "Use $create-ai-promo-video to design a distinct library-first Revideo composition in the right format, render it, and visually review the result."
dependencies:
  tools:
    - type: "mcp"
      value: "ai-promo-video"
      description: "Searches licensed media and motion components, prepares captions and formats, captures products, and renders editable Revideo compositions."
      transport: "stdio"
policy:
  allow_implicit_invocation: true
